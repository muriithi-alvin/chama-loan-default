# Pipeline settings. Paths are relative to the project root.
# Each Chama has a folder of yearly Excel files (e.g. data/raw/chama_b/2014.xlsx).
# The loader reads every .xlsx in the folder and combines them.
chamas:
  - id: chama_a          # the first Chama (records from 2023; no data yet, D-014)
    raw_dir: data/raw/chama_a
  - id: chama_b          # the second Chama (records from 2014)
    raw_dir: data/raw/chama_b

# Sheet and column layout lives in src/chama/ingestion/raw_format.py

# Chama rule (confirmed): a loan falls due 12 months after it is issued.
# Used only when the ledger has no due month for a loan. A later due month
# written in the ledger is an extension agreed for that loan and wins (D-012).
loan_term_days: 365
# Emergency loans are repaid at the next meeting
emergency_term_days: 31

# Milestone 2 - the modelling table (analytics.loan_features).
# Loan statuses that count as a default (D-018). overdue (past its due month
# and unpaid at the end of the records) is confirmed as a default; topped_up
# (rolled into a bigger loan while unpaid) and lost_track (stops appearing)
# are provisional until agreed with the Chama.
default_statuses: [topped_up, overdue, lost_track]
# "Recent" behaviour features look back this many months before a loan is given.
history_months: 12
# Early-warning target (analytics.member_months, D-021): did the member miss a
# repayment within this many meetings after the current one?
warning_horizon_meetings: 3

# Milestone 2 - training and evaluation (src/chama/models, decisions D-020, D-021).
modelling:
  member_folds: 5            # second check: each member's rows held out together
  models: [logistic_regression, random_forest, xgboost]
  # Ways to handle the imbalance, compared on the same tests: none, class
  # weights, k-means SMOTE (adds synthetic events inside k-means clusters),
  # k-means cluster centroids (keeps one real non-event row per cluster).
  # Resampling is applied to training folds only, then scores are moved back
  # to the real share of events (prior correction).
  imbalance: [none, class_weight, kmeans_smote, cluster_centroids]
  bootstrap_samples: 1000    # for confidence intervals of the test metrics
  random_state: 42
  # Risk bands (D-022) are set by share, not by fixed scores: each run puts the
  # top `high` share of its walk-forward scores in the high band and the next
  # `medium` share in the medium band, logs the score cut-offs to MLflow, and
  # reports how often each band had the event in testing. The scores rank well
  # but are compressed, so fixed probability cut-offs left the high band empty.
  # Walk forward: each test year is scored by a model trained only on rows from
  # before that year whose outcome was known before it.
  targets:
    loan_default:            # will this loan default? (loan_features)
      experiment: chama-loan-default   # MLflow experiment
      # Loans given after 2024 have had too little time to show a default.
      # 2018 and 2019 train on only 5-6 known defaults, but without them the
      # test would rest on 12 defaults instead of 22.
      test_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
      min_training_events: 5   # skip a test year with fewer known events before it
      # Computed the same way, but no run's bands separate defaults yet (D-022).
      band_shares: {high: 0.20, medium: 0.30}
      # The model carried forward (D-023): the same as missed_repayment, since
      # no model or strategy ranks future loans reliably.
      chosen: {model: random_forest, imbalance: none}
    missed_repayment:        # will a repayment be missed in the next meetings? (member_months)
      experiment: chama-missed-repayment
      # 2014-2015 give the first training years; 2026 has too few known rows.
      test_years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
      min_training_events: 20
      # Top 20% high, next 30% medium, bottom 50% low; to agree with the Chama.
      band_shares: {high: 0.20, medium: 0.30}
      # The model carried forward (D-023): tied best walk-forward PR AUC with
      # the simplest set-up; bands of 12% / 24% / 35% missed in testing.
      chosen: {model: random_forest, imbalance: none}
