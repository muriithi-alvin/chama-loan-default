[project]
name = "chama"
version = "0.1.0"
description = "Loan default risk prediction for Kenyan Chama groups"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "click>=8.1",
    "dbt-postgres>=1.9",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jupyter>=1.0"]
# Milestone 2 modelling, locally and in Colab
ml = [
    "scikit-learn>=1.5", "imbalanced-learn>=0.12", "xgboost>=2.1", "shap>=0.46",
    "mlflow>=3.0", "matplotlib>=3.8",
]
# Milestone 3 - ledger photo extraction: Groq (OpenAI-style API) or the Claude API (D-024, D-025)
extraction = ["httpx>=0.27", "anthropic>=2.2", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
