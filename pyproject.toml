[project]
name = "chama"
version = "0.1.0"
description = "Loan default risk prediction for Kenyan Chama groups"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandera>=0.20",
    "click>=8.1",
    "dbt-postgres>=1.9",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jupyter>=1.0"]
# Milestone 2 modelling, locally and in Colab
ml = [
    "scikit-learn>=1.5", "imbalanced-learn>=0.12", "xgboost>=2.1", "shap>=0.46",
    "mlflow>=3.0", "matplotlib>=3.8",
    # S-7: data drift reports (D-031)
    "evidently>=0.7,<0.8",
]
# Milestone 3 - ledger photo extraction: Groq (OpenAI-style API) or the Claude API (D-024, D-025)
extraction = ["httpx>=0.27", "anthropic>=2.2", "pillow>=10"]
# The cloud release: deploy-publish, run from the laptop (D-032)
deploy = ["huggingface_hub>=1.0"]
# Milestone 4 - the web interface's API and worker (D-026, D-027). Scoring and
# reading scans also need `ml` and `extraction`: pip install -e ".[ml,extraction,web]"
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.20", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
