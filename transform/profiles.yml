# Database connection. Values come from .env (the pipeline loads it), so no
# secrets are stored here.
chama:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'prefer') }}"
      schema: analytics
      threads: 4
