version: 2

models:
  - name: meetings
    description: >
      One row per ledger page (one monthly meeting) with typed footer amounts
      and a meeting month for every page. `issues` lists anything that could
      not be read; the row is kept.
    columns:
      - name: page_id
        description: chama_id:source_photo
        data_tests: [unique, not_null]
      - name: page_no
        data_tests: [not_null]
      - name: meeting_month
        description: First day of the meeting's month (written, from the previous page's note, or estimated)
        data_tests: [not_null]
      - name: meeting_date
        description: Exact date when known
      - name: date_source
        data_tests:
          - accepted_values:
              arguments:
                values: [written, written_month, previous_page, estimated]

  - name: statements
    description: >
      One row per member line on a ledger page with typed amounts. Amounts
      written as sums ("5500 + 776") are added up; "-" means nothing (0).
      Rows that cannot be read stay in, with the reason in `issues`.
    columns:
      - name: line_id
        description: chama_id:source_file:source_row
        data_tests: [unique, not_null]
      - name: page_id
        data_tests:
          - relationships:
              arguments:
                to: ref('meetings')
                field: page_id
      - name: member_code
      - name: meeting_month
        data_tests: [not_null]
      - name: line_kind
        description: balance, loan_given, repayment_only, no_loan (dashes or only a contribution) or empty
        data_tests:
          - accepted_values:
              arguments:
                values: [balance, loan_given, repayment_only, no_loan, empty]
      - name: loan_type
        description: From the mark beside the name (Em / Eme = emergency); empty if no mark
        data_tests:
          - accepted_values:
              arguments:
                values: [emergency, school_fees, top_up, other]
      - name: interest_rate_pct
        description: Interest written as a rate ("2%" or a number up to 20)
      - name: interest_amount
        description: Interest written as an amount (a number above 20, no %)
      - name: closing_balance
        description: >
          Balance carried to the next meeting: the balance after when written,
          the balance itself for a loan given, 0 when the repayment covers the
          balance, otherwise worked out (closing_estimated = true)
      - name: due_month
        description: >
          Month the loan is due, as written. When no year is written ("Aug")
          it is the next such month after the meeting (due_year_inferred = true).

  - name: new_loans
    description: One row per loan listed as given at a meeting.
    columns:
      - name: line_id
        data_tests: [unique, not_null]
      - name: loan_type
        data_tests:
          - accepted_values:
              arguments:
                values: [normal, emergency, school_fees, top_up, other]
      - name: loan_month
        description: Month the loan was given (see loan_month_source)
      - name: loan_month_source
        data_tests:
          - accepted_values:
              arguments:
                values: [written, month_only, meeting]

  - name: attendance
    description: One row per member per meeting, from the minutes.
    columns:
      - name: line_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [present, absent, apology, late]

unit_tests:
  - name: amounts_dates_and_interest_are_read_as_written
    model: statements
    given:
      - input: source('staging', 'statements')
        rows:
          - {chama_id: c, source_file: f.xlsx, source_row: 2, source_photo: c_p001.jpg, member_code: M-1,
             loan_before: "40,000", repayment: "5500 + 776", interest: "2%", loan_after: "-", due: "Nov. 2014"}
          - {chama_id: c, source_file: f.xlsx, source_row: 3, source_photo: c_p001.jpg, member_code: M-2,
             loan_before: "46 000", repayment: "-", interest: "1", loan_after: "46,460", due: "Aug"}
          - {chama_id: c, source_file: f.xlsx, source_row: 4, source_photo: c_p001.jpg, member_code: M-3,
             loan_before: "Ksh. 30,000/=", interest: "2100", due: "11/15"}
          - {chama_id: c, source_file: f.xlsx, source_row: 5, source_photo: c_p001.jpg, member_code: M-4,
             loan_before: "?", repayment: "500"}
          - {chama_id: c, source_file: f.xlsx, source_row: 6, source_photo: c_p001.jpg, member_code: M-5,
             loan_before: "20,000", repayment: "21,000", loan_after: "Cleared", loan_type: "(Em)",
             due: "Sept 201"}
          - {chama_id: c, source_file: f.xlsx, source_row: 7, source_photo: c_p001.jpg, member_code: M-6,
             loan_before: "-", repayment: "-", loan_after: "-", due: "-"}
          - {chama_id: c, source_file: f.xlsx, source_row: 8, source_photo: c_p001.jpg, member_code: M-7,
             loan_before: "-", repayment: "-", loan_after: "150,000"}
          - {chama_id: c, source_file: f.xlsx, source_row: 9, source_photo: c_p001.jpg, member_code: M-8,
             monthly: "Penalty", repayment: "100", loan_after: "-"}
      - input: ref('meetings')
        rows:
          - {page_id: "c:c_p001.jpg", page_no: 1, meeting_month: "2014-08-01"}
    expect:
      rows:
        - {line_id: "c:f.xlsx:2", line_kind: balance, loan_before: 40000, repayment: 6276,
           interest_rate_pct: 2, interest_amount: null, loan_after: 0, closing_balance: 0,
           due_month: "2014-11-01", due_year_inferred: false, issues: null}
        - {line_id: "c:f.xlsx:3", line_kind: balance, loan_before: 46000, repayment: 0,
           interest_rate_pct: 1, interest_amount: null, loan_after: 46460, closing_balance: 46460,
           due_month: "2015-08-01", due_year_inferred: true, issues: null}
        - {line_id: "c:f.xlsx:4", line_kind: loan_given, loan_before: 30000, repayment: null,
           interest_rate_pct: null, interest_amount: 2100, loan_after: null, closing_balance: 30000,
           due_month: "2015-11-01", due_year_inferred: false, issues: null}
        - {line_id: "c:f.xlsx:5", line_kind: repayment_only, loan_before: null, repayment: 500,
           interest_rate_pct: null, interest_amount: null, loan_after: null, closing_balance: null,
           due_month: null, due_year_inferred: false, issues: loan_before_unparsed}
        - {line_id: "c:f.xlsx:6", line_kind: balance, loan_before: 20000, repayment: 21000,
           interest_rate_pct: null, interest_amount: null, loan_after: 0, closing_balance: 0,
           due_month: "2014-09-01", due_year_inferred: true, issues: null}
        - {line_id: "c:f.xlsx:7", line_kind: no_loan, loan_before: 0, repayment: 0,
           interest_rate_pct: null, interest_amount: null, loan_after: 0, closing_balance: 0,
           due_month: null, due_year_inferred: false, issues: null}
        - {line_id: "c:f.xlsx:8", line_kind: loan_given, loan_before: 0, repayment: 0,
           interest_rate_pct: null, interest_amount: null, loan_after: 150000, closing_balance: 150000,
           due_month: null, due_year_inferred: false, issues: null}
        - {line_id: "c:f.xlsx:9", line_kind: repayment_only, loan_before: null, repayment: 100,
           interest_rate_pct: null, interest_amount: null, loan_after: 0, closing_balance: 0,
           due_month: null, due_year_inferred: false, issues: null}

  - name: undated_pages_get_a_month
    model: meetings
    given:
      - input: source('staging', 'meetings')
        rows:
          - {chama_id: c, source_photo: c_p001.jpg, next_meeting_date: "9th March",
             total_collection: "Ksh 67,210", brought_forward: "?"}
          - {chama_id: c, source_photo: c_p002.jpg}
          - {chama_id: c, source_photo: c_p003.jpg, meeting_date: "6/4/14"}
          - {chama_id: c, source_photo: c_p004.jpg}
          - {chama_id: c, source_photo: c_p005.jpg, meeting_date: "7th June 2014", total_collection: "92,400/-"}
          - {chama_id: c, source_photo: c_p006.jpg, meeting_date: "July 2014"}
          - {chama_id: c, source_photo: c_p007.jpg, meeting_date: "August 3rd 2014"}
    expect:
      rows:
        - {page_no: 1, meeting_month: "2014-02-01", meeting_date: null, date_source: estimated,
           total_collection: 67210, issues: brought_forward_unparsed}
        - {page_no: 2, meeting_month: "2014-03-01", meeting_date: "2014-03-09",
           date_source: previous_page, total_collection: null, issues: null}
        - {page_no: 3, meeting_month: "2014-04-01", meeting_date: "2014-04-06",
           date_source: written, total_collection: null, issues: null}
        - {page_no: 4, meeting_month: "2014-05-01", meeting_date: null, date_source: estimated,
           total_collection: null, issues: null}
        - {page_no: 5, meeting_month: "2014-06-01", meeting_date: "2014-06-07", date_source: written,
           total_collection: 92400, issues: null}
        - {page_no: 6, meeting_month: "2014-07-01", meeting_date: null, date_source: written_month,
           total_collection: null, issues: null}
        - {page_no: 7, meeting_month: "2014-08-01", meeting_date: "2014-08-03", date_source: written,
           total_collection: null, issues: null}
